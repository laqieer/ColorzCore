name: CI

on:
  push:
    branches: [master]
    tags: ["v*", "V*", "Release*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build release payload
        shell: pwsh
        run: |
          dotnet publish ColorzCore/ColorzCore.csproj -c Release -o artifacts/package/net10
          dotnet build ColorzCore/ColorzCore.Framework.csproj -c Release
          New-Item -ItemType Directory -Force artifacts/package/net48 | Out-Null
          Copy-Item ColorzCore/bin/Framework/Release/net48/* artifacts/package/net48 -Recurse -Force
          Copy-Item README.md artifacts/package/

      - name: Verify modern publish payload
        shell: pwsh
        run: |
          $appHostName = if ($IsWindows) { 'ColorzCore.exe' } else { 'ColorzCore' }
          $requiredFiles = @(
            $appHostName,
            'ColorzCore.dll',
            'ColorzCore.deps.json',
            'ColorzCore.runtimeconfig.json'
          )

          foreach ($publishDir in @(
            'ColorzCore/bin/Core/Release/net10.0',
            'artifacts/package/net10'
          )) {
            foreach ($requiredFile in $requiredFiles) {
              $requiredPath = Join-Path $publishDir $requiredFile
              if (-not (Test-Path $requiredPath -PathType Leaf)) {
                throw "Missing publish artifact: $requiredPath"
              }
            }
          }

          $appHostPath = Join-Path 'artifacts/package/net10' $appHostName
          & $appHostPath A FE6 --help > $null
          if ($LASTEXITCODE -ne 0) {
            throw "Modern apphost smoke test failed with exit code $LASTEXITCODE."
          }

      - name: Run tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python Tests/test_test_runner.py
          python Tests/run_tests.py artifacts/package/net48/ColorzCore.exe

      - name: Package artifact
        shell: pwsh
        run: |
          $zip = "artifacts/ColorzCore-${{ runner.os }}.zip"
          Compress-Archive -Path artifacts/package/* -DestinationPath $zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorzCore-${{ runner.os }}
          path: artifacts/ColorzCore-${{ runner.os }}.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
